<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-label="Facebook Your time on Facebook with Daily time reminder and Quiet mode highlighted">
  <style>.t{font:15px 'Segoe UI',Roboto,Arial,sans-serif;fill:#222}.s{font:12px 'Segoe UI',Roboto,Arial,sans-serif;fill:#666}.h{font:600 20px 'Segoe UI',Roboto,Arial,sans-serif;fill:#111}.hl{fill:none;stroke:#E53935;stroke-width:3}.c{fill:#E53935}.cn{font:700 14px Arial,sans-serif;fill:#fff;text-anchor:middle}.cap{font:italic 11px Arial,sans-serif;fill:#999;text-anchor:middle}</style>
  <rect x="4" y="4" width="352" height="632" rx="38" fill="#1b1b1b"/>
  <rect x="14" y="14" width="332" height="612" rx="30" fill="#fff"/>
  <rect x="145" y="22" width="70" height="16" rx="8" fill="#1b1b1b"/>
  <text class="h" x="32" y="78">‹  Your time on Facebook</text>
  <text class="s" x="180" y="122" text-anchor="middle">Daily average this week</text>
  <text class="h" x="180" y="152" text-anchor="middle">58 min</text>
  <line x1="32" y1="182" x2="328" y2="182" stroke="#e0e0e0"/>
  <text class="t" x="32" y="230">Quiet mode</text>
  <text class="s" x="32" y="250">Pause notifications for a set time</text>
  <rect x="282" y="218" width="44" height="24" rx="12" fill="#1877F2"/><circle cx="314" cy="230" r="9" fill="#fff"/>
  <rect x="22" y="206" width="316" height="56" rx="10" class="hl"/>
  <circle class="c" cx="330" cy="206" r="13"/><text class="cn" x="330" y="211">2</text>
  <text class="t" x="32" y="306">Daily time reminder</text>
  <text class="s" x="32" y="326">Remind me after 30 minutes</text>
  <rect x="282" y="294" width="44" height="24" rx="12" fill="#1877F2"/><circle cx="314" cy="306" r="9" fill="#fff"/>
  <rect x="22" y="282" width="316" height="56" rx="10" class="hl"/>
  <circle class="c" cx="330" cy="282" r="13"/><text class="cn" x="330" y="287">1</text>
  <text class="t" x="32" y="382">Notification settings</text><text class="s" x="314" y="382">›</text>
  <text class="cap" x="180" y="612">Illustration – your screen may look a little different</text>
</svg>
