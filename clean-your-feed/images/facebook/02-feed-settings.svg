<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-label="Facebook Feed settings with Favorites, Unfollow and Snoozed">
  <style>.t{font:15px 'Segoe UI',Roboto,Arial,sans-serif;fill:#222}.s{font:12px 'Segoe UI',Roboto,Arial,sans-serif;fill:#666}.h{font:600 20px 'Segoe UI',Roboto,Arial,sans-serif;fill:#111}.hl{fill:none;stroke:#E53935;stroke-width:3}.c{fill:#E53935}.cn{font:700 14px Arial,sans-serif;fill:#fff;text-anchor:middle}.cap{font:italic 11px Arial,sans-serif;fill:#999;text-anchor:middle}</style>
  <rect x="4" y="4" width="352" height="632" rx="38" fill="#1b1b1b"/>
  <rect x="14" y="14" width="332" height="612" rx="30" fill="#fff"/>
  <rect x="145" y="22" width="70" height="16" rx="8" fill="#1b1b1b"/>
  <text class="h" x="32" y="78">‹  Feed</text>
  <text class="t" x="32" y="136">★  Favorites</text>
  <text class="s" x="58" y="156">Prioritize posts from people you choose</text>
  <rect x="22" y="112" width="316" height="56" rx="10" class="hl"/>
  <circle class="c" cx="330" cy="112" r="13"/><text class="cn" x="330" y="117">1</text>
  <text class="t" x="32" y="212">✕  Unfollow</text>
  <text class="s" x="58" y="232">Stop seeing posts but stay friends</text>
  <rect x="22" y="188" width="316" height="56" rx="10" class="hl"/>
  <circle class="c" cx="330" cy="188" r="13"/><text class="cn" x="330" y="193">2</text>
  <text class="t" x="32" y="288">↺  Reconnect</text>
  <text class="s" x="58" y="308">Follow people you unfollowed</text>
  <text class="t" x="32" y="364">⏱  Snoozed</text>
  <text class="s" x="58" y="384">See and end snoozes</text>
  <text class="t" x="32" y="440">⊘  Reduce</text>
  <text class="s" x="58" y="460">Show less of some types of content</text>
  <rect x="22" y="416" width="316" height="56" rx="10" class="hl"/>
  <circle class="c" cx="330" cy="416" r="13"/><text class="cn" x="330" y="421">3</text>
  <text class="cap" x="180" y="612">Illustration – your screen may look a little different</text>
</svg>
