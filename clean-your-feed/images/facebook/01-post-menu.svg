<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-label="Facebook post menu with Not interested, Snooze and Unfollow highlighted">
  <style>.t{font:15px 'Segoe UI',Roboto,Arial,sans-serif;fill:#222}.s{font:12px 'Segoe UI',Roboto,Arial,sans-serif;fill:#666}.h{font:600 20px 'Segoe UI',Roboto,Arial,sans-serif;fill:#111}.hl{fill:none;stroke:#E53935;stroke-width:3}.c{fill:#E53935}.cn{font:700 14px Arial,sans-serif;fill:#fff;text-anchor:middle}.cap{font:italic 11px Arial,sans-serif;fill:#999;text-anchor:middle}</style>
  <rect x="4" y="4" width="352" height="632" rx="38" fill="#1b1b1b"/>
  <rect x="14" y="14" width="332" height="612" rx="30" fill="#fff"/>
  <rect x="145" y="22" width="70" height="16" rx="8" fill="#1b1b1b"/>
  <text class="h" x="32" y="78" style="fill:#1877F2;font-size:24px;font-weight:700">facebook</text>
  <circle cx="44" cy="118" r="16" fill="#FFCC80"/>
  <text class="t" x="70" y="114" style="font-weight:600">Some Page</text>
  <text class="s" x="70" y="130">2h · 🌐</text>
  <text class="h" x="300" y="122">⋯</text>
  <rect x="292" y="100" width="36" height="30" rx="8" class="hl"/>
  <circle class="c" cx="292" cy="100" r="13"/><text class="cn" x="292" y="105">1</text>
  <rect x="14" y="146" width="332" height="190" fill="#b0bec5"/>
  <rect x="14" y="14" width="332" height="612" rx="30" fill="#000" opacity=".45"/>
  <rect x="14" y="300" width="332" height="326" rx="22" fill="#fff"/>
  <rect x="160" y="310" width="40" height="5" rx="2.5" fill="#ccc"/>
  <text class="t" x="40" y="352">⊕  Interested</text>
  <text class="t" x="40" y="396">⊖  Not interested</text>
  <rect x="26" y="376" width="300" height="30" rx="8" class="hl"/>
  <circle class="c" cx="320" cy="376" r="13"/><text class="cn" x="320" y="381">2</text>
  <text class="t" x="40" y="440">🔖  Save post</text>
  <text class="t" x="40" y="484">⏱  Snooze Some Page for 30 days</text>
  <rect x="26" y="464" width="300" height="30" rx="8" class="hl"/>
  <circle class="c" cx="320" cy="464" r="13"/><text class="cn" x="320" y="469">3</text>
  <text class="t" x="40" y="528">✕  Unfollow Some Page</text>
  <rect x="26" y="508" width="300" height="30" rx="8" class="hl"/>
  <circle class="c" cx="320" cy="508" r="13"/><text class="cn" x="320" y="513">4</text>
  <text class="t" x="40" y="572">⚑  Report post</text>
  <text class="cap" x="180" y="612">Illustration – your screen may look a little different</text>
</svg>
