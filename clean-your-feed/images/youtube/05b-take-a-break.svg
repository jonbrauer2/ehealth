<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-label="YouTube Time management settings with Remind me to take a break and bedtime reminders highlighted">
  <style>.t{font:15px 'Segoe UI',Roboto,Arial,sans-serif;fill:#222}.s{font:12px 'Segoe UI',Roboto,Arial,sans-serif;fill:#666}.h{font:600 20px 'Segoe UI',Roboto,Arial,sans-serif;fill:#111}.hl{fill:none;stroke:#E53935;stroke-width:3}.c{fill:#E53935}.cn{font:700 14px Arial,sans-serif;fill:#fff;text-anchor:middle}.cap{font:italic 11px Arial,sans-serif;fill:#999;text-anchor:middle}</style>
  <rect x="4" y="4" width="352" height="632" rx="38" fill="#1b1b1b"/>
  <rect x="14" y="14" width="332" height="612" rx="30" fill="#fff"/>
  <rect x="145" y="22" width="70" height="16" rx="8" fill="#1b1b1b"/>
  <text class="h" x="32" y="78">‹  Time management</text>
  <text class="t" x="32" y="140">Remind me to take a break</text>
  <text class="s" x="32" y="160">Every 30 minutes</text>
  <rect x="282" y="128" width="44" height="24" rx="12" fill="#065FD4"/><circle cx="314" cy="140" r="9" fill="#fff"/>
  <rect x="22" y="112" width="316" height="58" rx="10" class="hl"/>
  <circle class="c" cx="330" cy="112" r="13"/><text class="cn" x="330" y="117">1</text>
  <text class="t" x="32" y="216">Remind me when it's bedtime</text>
  <text class="s" x="32" y="236">10:00 PM – 6:00 AM</text>
  <rect x="282" y="204" width="44" height="24" rx="12" fill="#065FD4"/><circle cx="314" cy="216" r="9" fill="#fff"/>
  <rect x="22" y="188" width="316" height="58" rx="10" class="hl"/>
  <circle class="c" cx="330" cy="188" r="13"/><text class="cn" x="330" y="193">2</text>
  <text class="t" x="32" y="292">Time watched</text><text class="s" x="314" y="292">›</text>
  <text class="cap" x="180" y="612">Illustration – your screen may look a little different</text>
</svg>
