<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-label="Instagram profile Following menu with Mute and Unfollow highlighted">
  <style>.t{font:15px 'Segoe UI',Roboto,Arial,sans-serif;fill:#222}.s{font:12px 'Segoe UI',Roboto,Arial,sans-serif;fill:#666}.h{font:600 20px 'Segoe UI',Roboto,Arial,sans-serif;fill:#111}.hl{fill:none;stroke:#E53935;stroke-width:3}.c{fill:#E53935}.cn{font:700 14px Arial,sans-serif;fill:#fff;text-anchor:middle}.cap{font:italic 11px Arial,sans-serif;fill:#999;text-anchor:middle}.b{font:600 14px 'Segoe UI',Roboto,Arial,sans-serif;fill:#111;text-anchor:middle}</style>
  <rect x="4" y="4" width="352" height="632" rx="38" fill="#1b1b1b"/>
  <rect x="14" y="14" width="332" height="612" rx="30" fill="#fff"/>
  <rect x="145" y="22" width="70" height="16" rx="8" fill="#1b1b1b"/>
  <text class="h" x="32" y="78">‹  someaccount</text>
  <circle cx="70" cy="136" r="38" fill="#F48FB1"/>
  <text class="b" x="170" y="132">412</text><text class="s" x="155" y="150">posts</text>
  <text class="b" x="240" y="132">9.8K</text><text class="s" x="218" y="150">followers</text>
  <text class="b" x="306" y="132">300</text><text class="s" x="286" y="150">following</text>
  <rect x="32" y="196" width="140" height="34" rx="8" fill="#efefef"/><text class="b" x="102" y="218">Following ⌄</text>
  <rect x="28" y="192" width="148" height="42" rx="10" class="hl"/>
  <circle class="c" cx="28" cy="192" r="13"/><text class="cn" x="28" y="197">1</text>
  <rect x="182" y="196" width="146" height="34" rx="8" fill="#efefef"/><text class="b" x="255" y="218">Message</text>
  <rect x="14" y="14" width="332" height="612" rx="30" fill="#000" opacity=".45"/>
  <rect x="14" y="300" width="332" height="326" rx="22" fill="#fff"/>
  <rect x="160" y="310" width="40" height="5" rx="2.5" fill="#ccc"/>
  <text class="b" x="180" y="346">someaccount</text>
  <text class="t" x="40" y="392">Add to close friends list</text>
  <text class="t" x="40" y="432">Add to favorites</text>
  <text class="t" x="40" y="472">Mute</text><text class="s" x="300" y="472">›</text>
  <rect x="26" y="452" width="300" height="30" rx="8" class="hl"/>
  <circle class="c" cx="320" cy="452" r="13"/><text class="cn" x="320" y="457">2</text>
  <text class="t" x="40" y="512">Restrict</text><text class="s" x="300" y="512">›</text>
  <text class="t" x="40" y="552">Unfollow</text>
  <rect x="26" y="532" width="300" height="30" rx="8" class="hl"/>
  <circle class="c" cx="320" cy="532" r="13"/><text class="cn" x="320" y="537">3</text>
  <text class="cap" x="180" y="612">Illustration – your screen may look a little different</text>
</svg>
