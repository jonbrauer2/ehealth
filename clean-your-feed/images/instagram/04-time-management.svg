<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-label="Instagram time management with Daily limit and Sleep mode highlighted">
  <style>.t{font:15px 'Segoe UI',Roboto,Arial,sans-serif;fill:#222}.s{font:12px 'Segoe UI',Roboto,Arial,sans-serif;fill:#666}.h{font:600 20px 'Segoe UI',Roboto,Arial,sans-serif;fill:#111}.hl{fill:none;stroke:#E53935;stroke-width:3}.c{fill:#E53935}.cn{font:700 14px Arial,sans-serif;fill:#fff;text-anchor:middle}.cap{font:italic 11px Arial,sans-serif;fill:#999;text-anchor:middle}</style>
  <rect x="4" y="4" width="352" height="632" rx="38" fill="#1b1b1b"/>
  <rect x="14" y="14" width="332" height="612" rx="30" fill="#fff"/>
  <rect x="145" y="22" width="70" height="16" rx="8" fill="#1b1b1b"/>
  <text class="h" x="32" y="78">‹  Time management</text>
  <text class="s" x="180" y="122" text-anchor="middle">Daily average</text>
  <text class="h" x="180" y="152" text-anchor="middle">1h 42m</text>
  <rect x="60" y="170" width="24" height="60" fill="#90CAF9"/><rect x="94" y="150" width="24" height="80" fill="#90CAF9"/><rect x="128" y="190" width="24" height="40" fill="#90CAF9"/><rect x="162" y="160" width="24" height="70" fill="#90CAF9"/><rect x="196" y="180" width="24" height="50" fill="#90CAF9"/><rect x="230" y="140" width="24" height="90" fill="#90CAF9"/><rect x="264" y="200" width="24" height="30" fill="#90CAF9"/>
  <line x1="32" y1="256" x2="328" y2="256" stroke="#e0e0e0"/>
  <text class="t" x="32" y="300">Daily limit</text>
  <text class="s" x="32" y="320">30 minutes</text>
  <text class="s" x="314" y="306">›</text>
  <rect x="22" y="276" width="316" height="56" rx="10" class="hl"/>
  <circle class="c" cx="330" cy="276" r="13"/><text class="cn" x="330" y="281">1</text>
  <text class="t" x="32" y="376">Sleep mode</text>
  <text class="s" x="32" y="396">Mutes notifications 10 PM – 7 AM</text>
  <text class="s" x="314" y="382">›</text>
  <rect x="22" y="352" width="316" height="56" rx="10" class="hl"/>
  <circle class="c" cx="330" cy="352" r="13"/><text class="cn" x="330" y="357">2</text>
  <text class="t" x="32" y="452">Notifications</text><text class="s" x="314" y="452">›</text>
  <text class="cap" x="180" y="612">Illustration – your screen may look a little different</text>
</svg>
