  <rect x="4" y="4" width="352" height="632" rx="38" fill="#1b1b1b"/>
  <rect x="14" y="14" width="332" height="612" rx="30" fill="#fff"/>
  <rect x="145" y="22" width="70" height="16" rx="8" fill="#1b1b1b"/>
  <text class="h" x="32" y="78">‹  Content preferences</text>
  <text class="t" x="32" y="140">Sensitive content</text>
  <text class="s" x="32" y="160">Less · Standard · More</text>
  <text class="s" x="314" y="146">›</text>
  <rect x="22" y="116" width="316" height="56" rx="10" class="hl"/>
  <circle class="c" cx="330" cy="116" r="13"/><text class="cn" x="330" y="121">2</text>
  <text class="t" x="32" y="214">Political content</text><text class="s" x="314" y="214">›</text>
  <text class="t" x="32" y="262">Muted accounts</text><text class="s" x="314" y="262">›</text>
