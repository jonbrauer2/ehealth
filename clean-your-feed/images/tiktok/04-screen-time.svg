<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-label="TikTok Screen time settings with Daily screen time and Screen time breaks highlighted">
  <style>.t{font:15px 'Segoe UI',Roboto,Arial,sans-serif;fill:#222}.s{font:12px 'Segoe UI',Roboto,Arial,sans-serif;fill:#666}.h{font:600 20px 'Segoe UI',Roboto,Arial,sans-serif;fill:#111}.hl{fill:none;stroke:#E53935;stroke-width:3}.c{fill:#E53935}.cn{font:700 14px Arial,sans-serif;fill:#fff;text-anchor:middle}.cap{font:italic 11px Arial,sans-serif;fill:#999;text-anchor:middle}</style>
  <rect x="4" y="4" width="352" height="632" rx="38" fill="#1b1b1b"/>
  <rect x="14" y="14" width="332" height="612" rx="30" fill="#fff"/>
  <rect x="145" y="22" width="70" height="16" rx="8" fill="#1b1b1b"/>
  <text class="h" x="32" y="78">‹  Screen time</text>
  <text class="t" x="32" y="140">Daily screen time</text>
  <text class="s" x="32" y="160">On · 40 minutes</text>
  <text class="s" x="320" y="146">›</text>
  <rect x="22" y="116" width="316" height="56" rx="10" class="hl"/>
  <circle class="c" cx="330" cy="116" r="13"/><text class="cn" x="330" y="121">1</text>
  <text class="t" x="32" y="216">Screen time breaks</text>
  <text class="s" x="32" y="236">Remind me after 20 minutes</text>
  <text class="s" x="320" y="222">›</text>
  <rect x="22" y="192" width="316" height="56" rx="10" class="hl"/>
  <circle class="c" cx="330" cy="192" r="13"/><text class="cn" x="330" y="197">2</text>
  <text class="t" x="32" y="292">Sleep hours</text>
  <text class="s" x="32" y="312">10:00 PM – 6:00 AM</text>
  <text class="s" x="320" y="298">›</text>
  <rect x="22" y="268" width="316" height="56" rx="10" class="hl"/>
  <circle class="c" cx="330" cy="268" r="13"/><text class="cn" x="330" y="273">3</text>
  <text class="t" x="32" y="368">Weekly screen time updates</text>
  <text class="s" x="320" y="368">›</text>
  <text class="cap" x="180" y="612">Illustration – your screen may look a little different</text>
</svg>
